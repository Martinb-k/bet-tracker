<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Logic Engine</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; padding: 20px; text-align: center; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 400px; margin: auto; }
        input { padding: 12px; margin: 10px 0; width: 90%; border-radius: 8px; border: 1px solid #333; background: #252525; color: white; }
        button { padding: 12px; width: 95%; margin: 5px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-check { background: #00e676; color: #000; }
        .btn-lose { background: #ff5252; color: white; }
        #resultBox { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; font-weight: bold; }
        .history { margin-top: 30px; text-align: left; border-top: 1px solid #333; padding-top: 10px; }
        li { color: #ff8a80; list-style: "❌ "; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>⚽ Boy Child Logic</h1>
        <p style="font-size: 0.8rem; color: #888;">Stop the "Bro, I'm Fucked" moments.</p>

        <input type="text" id="teamInput" placeholder="Enter Team Name (e.g. Man Utd)">
        
        <button class="btn-check" onclick="analyze()">Analyze Bet</button>
        <button class="btn-lose" onclick="markAsLoss()">I Lost on this Team</button>

        <div id="resultBox"></div>

        <div class="history">
            <h4>Wall of Shame:</h4>
            <ul id="historyList"></ul>
            <button onclick="localStorage.clear(); location.reload();" style="background:none; color:#555; font-size:10px;">Clear All Data</button>
        </div>
    </div>

    <script>
        let losses = JSON.parse(localStorage.getItem('myLosses')) || [];

        function render() {
            const list = document.getElementById('historyList');
            list.innerHTML = losses.map(t => `<li>${t}</li>`).join('');
            localStorage.setItem('myLosses', JSON.stringify(losses));
        }

        function markAsLoss() {
            let team = document.getElementById('teamInput').value.trim().toUpperCase();
            if (team) {
                losses.push(team);
                render();
                alert(team + " added to your losses.");
            }
        }

        function analyze() {
            let team = document.getElementById('teamInput').value.trim().toUpperCase();
            let box = document.getElementById('resultBox');
            let count = losses.filter(t => t === team).length;

            box.style.display = "block";

            if (count >= 2) {
                box.style.background = "#d32f2f";
                box.innerHTML = `⚠️ BRO, YOU ARE FUCKED UP!<br><small>You lost on ${team} ${count} times. DO NOT BET!</small>`;
            } else if (count === 1) {
                box.style.background = "#f57c00";
                box.innerHTML = `🚨 CAUTION: You lost on ${team} once before. Watch out.`;
            } else {
                box.style.background = "#388e3c";
                box.innerHTML = `✅ Analysis Clear. No repeat mistakes for ${team}.`;
            }
        }
        render();
    </script>
</body>
</html>
