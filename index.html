<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARTIN'S SITE | VIP ACCESS</title>
    <style>
        :root { --bg: #050505; --door: #1a1a1a; --accent: #ffc107; --text: #ffffff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Arial Black', sans-serif; background: #000; overflow: hidden; }

        /* VIDEO BG */
        #video-bg { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -2; filter: brightness(0.3) blur(1px); object-fit: cover; }
        .overlay-dark { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: -1; }

        .flex-center { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
        
        /* DOOR SCREEN */
        #door-container { text-align: center; width: 320px; z-index: 10; transition: 0.5s; }
        .door { width: 160px; height: 250px; background: var(--door); border: 5px solid #333; border-radius: 10px 10px 0 0; margin: 0 auto; position: relative; }
        .door-sign { background: #000; padding: 5px 15px; border: 1px solid var(--accent); margin-top: 40px; display: inline-block; font-size: 0.6rem; color: var(--accent); cursor: pointer; }
        
        /* DASHBOARD / ADMIN */
        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        textarea { width: 100%; height: 200px; background: #000; color: #0f0; border: 1px solid #444; padding: 10px; font-family: monospace; }
        .admin-btn { background: var(--accent); color: #000; border: none; padding: 15px; width: 100%; font-weight: 900; margin-top: 10px; border-radius: 8px; }

        /* MAIN CONTENT */
        #main-site { display: none; width: 100%; max-width: 450px; height: 100vh; overflow-y: auto; padding: 20px; box-sizing: border-box; background: #0b0e14; z-index: 5; margin: auto; }
        .match-card { background: #161a23; padding: 15px; margin-bottom: 10px; border-radius: 10px; border-left: 6px solid var(--accent); }

        /* SPLASH */
        #splash-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); display: none; z-index: 999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .pay-box { border: 3px solid #ff4444; padding: 25px; border-radius: 15px; background: black; width: 85%; }
        
        input { background: rgba(0,0,0,0.8); border: 2px solid #444; color: var(--accent); padding: 15px; width: 90%; border-radius: 10px; text-align: center; font-size: 1.2rem; margin-top: 20px; outline: none; }
        .btn-open { background: var(--accent); border: none; padding: 16px; margin-top: 15px; font-weight: 900; border-radius: 10px; width: 95%; cursor: pointer; }
    </style>
</head>
<body>

    <video autoplay muted loop id="video-bg" playsinline><source src="https://assets.mixkit.co/videos/preview/mixkit-football-player-kicking-the-ball-in-slow-motion-41864-large.mp4" type="video/mp4"></video>
    <div class="overlay-dark"></div>

    <div id="splash-overlay">
        <div class="pay-box">
            <h1 style="color:#ff4444; margin:0;">ACCESS DENIED</h1>
            <p style="color:white;">Pay 200 KES to unlock:</p>
            <h2 style="color:var(--accent);">M-PESA: 0731945198</h2>
            <p style="color:#00ff41;">WhatsApp proof: 0750170861</p>
            <button onclick="location.reload()" style="padding:10px 20px; margin-top:10px;">TRY AGAIN</button>
        </div>
    </div>

    <div id="admin-panel">
        <h2 style="color:var(--accent)">ADMIN DASHBOARD</h2>
        <p>Set User Passcode:</p>
        <input type="text" id="newCode" placeholder="Current: 017614798" style="width:100%; box-sizing: border-box;">
        <p>Paste Daily Matches:</p>
        <textarea id="matchInput" placeholder="SAT | Team vs Team | Prediction"></textarea>
        <button class="admin-btn" onclick="saveAdminData()">SAVE & UPDATE SITE</button>
        <button class="admin-btn" style="background:#444; color:#fff;" onclick="location.reload()">CANCEL</button>
    </div>

    <div id="door-container" class="flex-center">
        <div class="door">
            <div class="door-sign" onclick="adminTrigger()">MARTIN'S SITE</div>
        </div>
        <input type="password" id="passInput" placeholder="ENTER CODE">
        <button class="btn-open" onclick="tryOpen()">Open Door</button>
    </div>

    <div id="main-site">
        <h1 style="color:var(--accent); text-align:center;">ATASA! 🔥</h1>
        <div id="match-list"></div>
        <button onclick="location.reload()" style="width:100%; background:#222; color:white; border:none; padding:15px; margin-top:30px; border-radius:10px;">LOCK DOOR</button>
    </div>

    <script>
        let clickCount = 0;
        function adminTrigger() {
            clickCount++;
            if(clickCount >= 3) {
                const pin = prompt("Enter Admin Key:");
                if(pin === "0707") { // Your secret Admin Key
                    document.getElementById('door-container').style.display = 'none';
                    document.getElementById('admin-panel').style.display = 'block';
                }
                clickCount = 0;
            }
        }

        function saveAdminData() {
            localStorage.setItem('userPass', document.getElementById('newCode').value || "017614798");
            localStorage.setItem('userMatches', document.getElementById('matchInput').value);
            alert("Updated Successfully!");
            location.reload();
        }

        function tryOpen() {
            const entered = document.getElementById('passInput').value;
            const correct = localStorage.getItem('userPass') || "017614798";
            
            if(entered === correct) {
                document.getElementById('door-container').style.display = "none";
                document.getElementById('video-bg').style.display = "none";
                document.getElementById('main-site').style.display = "block";
                loadMatches();
            } else {
                document.getElementById('splash-overlay').style.display = 'flex';
                if (navigator.vibrate) navigator.vibrate([500, 100, 500]);
            }
        }

        function loadMatches() {
            const raw = localStorage.getItem('userMatches') || "Admin hasn't added today's matches yet.";
            document.getElementById('match-list').innerHTML = raw.split('\n').map(m => `<div class="match-card">${m}</div>`).join('');
        }
    </script>
</body>
</html>
