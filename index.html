<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINNING ZONE | MARTINB-K</title>
    <style>
        :root { --bg: #0b0e14; --card: #161a23; --accent: #ffc107; --text: #ffffff; --dim: #8a8d91; --green: #00ff41; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        
        /* Navigation */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(11, 14, 20, 0.9); sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        .logo { font-weight: bold; color: var(--accent); letter-spacing: 1px; }
        .nav-links { display: flex; gap: 15px; font-size: 0.8rem; }
        .nav-links span { cursor: pointer; color: var(--dim); transition: 0.3s; }
        .nav-links .active { color: #fff; border-bottom: 2px solid var(--accent); }

        /* Hero & Search Section */
        .hero { padding: 40px 20px; text-align: left; max-width: 600px; }
        .live-status { color: var(--green); font-size: 0.7rem; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        h1 { font-size: 3rem; line-height: 1.1; margin: 10px 0; font-weight: 800; text-transform: uppercase; }
        h1 span { color: var(--accent); }
        
        .search-container { margin-top: 30px; position: relative; }
        input { background: #1c222d; border: 1px solid #333; color: #fff; padding: 18px; width: 90%; border-radius: 12px; font-size: 1rem; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(255, 193, 7, 0.2); }
        
        /* Results Area */
        #search-results { display: none; margin-top: 20px; animation: slideUp 0.4s ease; }
        .result-card { background: linear-gradient(145deg, #161a23, #1c222d); border-radius: 20px; padding: 25px; border: 1px solid #333; }
        .surity-box { font-size: 3.5rem; font-weight: 900; color: var(--accent); margin: 10px 0; }

        /* Tabbed Content */
        .page-section { display: none; padding: 20px; }
        .active-section { display: block; }
        
        .match-card { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 12px; border: 1px solid #222; }
        .badge { background: rgba(255,193,7,0.1); color: var(--accent); padding: 4px 10px; border-radius: 5px; font-size: 0.7rem; }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <nav>
        <div class="logo">WINNING ZONE</div>
        <div class="nav-links">
            <span class="active" onclick="showPage('home')">Predictions</span>
            <span onclick="showPage('report')">Report</span>
            <span onclick="showPage('builder')">Builder</span>
        </div>
    </nav>

    <div id="home" class="page-section active-section">
        <div class="hero">
            <div class="live-status"><span>●</span> LIVE NOW — DATABASE ACTIVE</div>
            <h1>BET SMARTER <span>WITH MARTINB-K.</span></h1>
            
            <div class="search-container">
                <input type="text" id="mainSearch" placeholder="Search team (e.g. Arsenal, Chelsea, Madrid)..." onkeyup="if(event.key === 'Enter') executeSearch()">
                <button onclick="executeSearch()" style="position: absolute; right: 5%; top: 15px; background: none; border: none; color: var(--accent); font-weight: bold; cursor: pointer;">GO</button>
            </div>

            <div id="search-results">
                <div class="result-card">
                    <div id="resLeague" class="badge">GLOBAL ANALYTICS</div>
                    <h2 id="resMatch" style="margin: 10px 0;">TEAM NAME</h2>
                    <div class="surity-box" id="resSurity">0%</div>
                    <p id="resAdvice" style="font-weight: bold; color: var(--green);"></p>
                    <button onclick="resetSearch()" style="background: #333; color: #fff; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-top: 15px;">CLOSE</button>
                </div>
            </div>
        </div>
    </div>

    <div id="report" class="page-section">
        <h2 style="letter-spacing: 2px;">DAILY REPORT</h2>
        <div id="matchList">
            </div>
    </div>

    <script>
        // --- UPLOAD YOUR MATCHES HERE ---
        const matches = [
            { team: "CHELSEA", vs: "Arsenal", league: "EPL", surity: 78, pick: "Double Chance (1X)" },
            { team: "REAL MADRID", vs: "Barca", league: "LA LIGA", surity: 92, pick: "Over 2.5 Goals" },
            { team: "GOR MAHIA", vs: "AFC Leopards", league: "KPL", surity: 85, pick: "Direct Win (1)" },
            { team: "GALATASARAY", vs: "Fenerbahce", league: "TURKEY", surity: 80, pick: "Home Win" }
        ];

        // This function builds the "Report" page automatically from your list
        function loadMatches() {
            const container = document.getElementById('matchList');
            container.innerHTML = matches.map(m => `
                <div class="match-card">
                    <div style="display:flex; justify-content:space-between; font-size:0.7rem; color:var(--dim);">
                        <span>${m.league}</span> <span>LIVE ANALYZED</span>
                    </div>
                    <h3 style="margin:10px 0;">${m.team} vs ${m.vs}</h3>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="badge">PICK: ${m.pick}</span>
                        <span style="color:var(--accent); font-weight:bold;">${m.surity}%</span>
                    </div>
                </div>
            `).join('');
        }

        // The Search Engine Logic
        function executeSearch() {
            const query = document.getElementById('mainSearch').value.toUpperCase();
            if(!query) return;

            const found = matches.find(m => m.team.includes(query) || m.vs.toUpperCase().includes(query));
            
            document.getElementById('search-results').style.display = 'block';
            if(found) {
                document.getElementById('resMatch').innerText = `${found.team} vs ${found.vs}`;
                document.getElementById('resSurity').innerText = found.surity + "%";
                document.getElementById('resAdvice').innerText = "RECOMMENDED: " + found.pick;
                document.getElementById('resLeague').innerText = found.league;
            } else {
                document.getElementById('resMatch').innerText = query;
                document.getElementById('resSurity').innerText = "65%";
                document.getElementById('resAdvice').innerText = "RECOMMENDED: Double Chance (X2)";
                document.getElementById('resLeague').innerText = "GENERAL ANALYTICS";
            }
        }

        function showPage(id) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active-section'));
            document.getElementById(id).classList.add('active-section');
            if(id === 'report') loadMatches();
        }

        function resetSearch() {
            document.getElementById('search-results').style.display = 'none';
            document.getElementById('mainSearch').value = "";
        }
    </script>
</body>
</html>
