<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARTIN'S SITE | VIP ACCESS</title>
    <style>
        :root { --bg: #0a0a0a; --door: #1a1a1a; --accent: #ffc107; --text: #ffffff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; background: #000; color: #fff; overflow: hidden; }

        /* SAFETY BACKGROUND */
        #main-bg-container {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1000&auto=format&fit=crop');
            background-size: cover; background-position: center; z-index: -1;
        }

        #video-bg {
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%;
            z-index: -2; filter: brightness(0.4); object-fit: cover;
        }

        .flex-center { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; text-align: center; }
        
        /* DOOR */
        #door-container { width: 300px; z-index: 10; }
        .door { width: 150px; height: 230px; background: var(--door); border: 4px solid #333; border-radius: 10px 10px 0 0; margin: 0 auto; position: relative; box-shadow: 0 0 30px #000; }
        .door-sign { background: #000; padding: 5px 10px; border: 1px solid var(--accent); margin-top: 30px; display: inline-block; font-size: 0.6rem; color: var(--accent); text-transform: uppercase; }
        .handle { position: absolute; right: 15px; top: 110px; width: 10px; height: 10px; background: var(--accent); border-radius: 50%; }
        
        input { background: rgba(0,0,0,0.8); border: 2px solid #444; color: var(--accent); padding: 15px; width: 85%; border-radius: 10px; text-align: center; font-size: 1.2rem; margin-top: 20px; outline: none; }
        .btn-open { background: var(--accent); border: none; padding: 15px; margin-top: 15px; font-weight: 900; border-radius: 10px; width: 90%; cursor: pointer; color: #000; }

        /* SPLASH */
        #splash-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); display: none; z-index: 999; flex-direction: column; align-items: center; justify-content: center; }
        .pay-box { border: 3px solid #ff4444; padding: 20px; border-radius: 15px; background: #000; width: 80%; text-align: center; }

        /* CONTENT */
        #main-site { display: none; width: 100%; max-width: 450px; height: 100vh; overflow-y: auto; padding: 20px; box-sizing: border-box; background: #0b0e14; margin: auto; }
        .match-card { background: #161a23; padding: 15px; margin-bottom: 10px; border-radius: 10px; border-left: 5px solid var(--accent); font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="main-bg-container"></div>
    <video autoplay muted loop id="video-bg" playsinline>
        <source src="https://assets.mixkit.co/videos/preview/mixkit-football-player-kicking-the-ball-in-slow-motion-41864-large.mp4" type="video/mp4">
    </video>

    <div id="splash-overlay">
        <div class="pay-box">
            <h1 style="color:#ff4444; margin:0;">WRONG CODE!</h1>
            <p>Access cost: 200 KES</p>
            <h2 style="color:var(--accent);">M-PESA: 0731945198</h2>
            <p>WhatsApp: 0750170861</p>
            <button onclick="location.reload()" style="padding:10px 20px; border-radius:5px; border:none; margin-top:10px;">TRY AGAIN</button>
        </div>
    </div>

    <div id="door-container" class="flex-center">
        <div class="door"><div class="door-sign">MARTIN'S SITE</div><div class="handle"></div></div>
        <input type="password" id="passInput" placeholder="ENTER CODE">
        <button class="btn-open" onclick="tryOpen()">Open Door</button>
    </div>

    <div id="main-site">
        <h1 style="color:var(--accent); text-align:center;">ATASA! 🔥</h1>
        <div id="match-list"></div>
        <button onclick="location.reload()" style="width:100%; background:#222; color:#fff; border:none; padding:15px; margin-top:20px; border-radius:10px;">EXIT</button>
    </div>

    <script>
        const CODE = "017614798"; 
        const RAW_MATCHES = `
SAT | Arsenal vs Man City | Under 2.5
SAT | Real Madrid vs Valencia | Home Win
SUN | Liverpool vs Everton | Home Win
SUN | Chelsea vs West Ham | Over 2.5`;

        function tryOpen() {
            const val = document.getElementById('passInput').value;
            if(val === CODE) {
                document.getElementById('door-container').style.display = "none";
                document.getElementById('video-bg').style.display = "none";
                document.getElementById('main-bg-container').style.display = "none";
                document.getElementById('main-site').style.display = "block";
                const list = document.getElementById('match-list');
                list.innerHTML = RAW_MATCHES.trim().split('\n').map(m => `<div class="match-card">${m}</div>`).join('');
            } else {
                document.getElementById('splash-overlay').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
