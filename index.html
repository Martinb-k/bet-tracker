<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINNING ZONE | MARTINB-K</title>
    <style>
        :root { --bg: #0b0e14; --card: #161a23; --accent: #ffc107; --text: #ffffff; --dim: #8a8d91; --green: #00ff41; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }
        
        .container { width: 100%; max-width: 450px; padding: 20px; margin: auto; }
        .panel { display: none; width: 100%; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Fire Animation */
        .fire-particle { position: fixed; font-size: 25px; pointer-events: none; z-index: 999; animation: flyUp 2s linear forwards; }
        @keyframes flyUp { 0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }

        /* UI Elements */
        #user-lock { text-align: center; margin-top: 80px; }
        input { background: #1c222d; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 12px; width: 100%; margin: 10px 0; outline: none; box-sizing: border-box; text-align: center; }
        .btn { background: var(--accent); color: #000; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        
        h1 { font-size: 3.5rem; line-height: 0.9; font-weight: 900; }
        h1 span { color: var(--accent); display: block; }
        
        .match-card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #222; }
        .pick-val { color: var(--green); font-weight: 800; }
        .admin-footer { position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 0.6rem; color: #111; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div id="user-lock" class="panel" style="display: block;">
            <div style="font-size: 3rem;">🔥</div>
            <h2 style="color: var(--accent);">WINNING ZONE</h2>
            <p style="color: var(--dim);">ENTER PASSCODE FOR FIRE PICKS</p>
            <input type="password" id="userPass" placeholder="••••">
            <button class="btn" onclick="checkUserAccess()">Unlock & Ignite</button>
            <div class="admin-footer" onclick="openAdminPrompt()">ADMIN ACCESS</div>
        </div>

        <div id="predictions-view" class="panel">
            <h1>BET <span>SMARTER.</span></h1>
            <div id="matchesContainer"></div>
            <button class="btn" onclick="location.reload()" style="background: #222; color: #fff; margin-top: 20px;">Exit</button>
        </div>

        <div id="admin-dash" class="panel">
            <h2 style="color: var(--green);">ADMIN PANEL</h2>
            <input type="text" id="newDailyPass" placeholder="Set New Passcode">
            <textarea id="matchesInput" rows="8" placeholder="Team A vs Team B | Pick | 90%"></textarea>
            <button class="btn" onclick="saveData()">Update Site</button>
        </div>
    </div>

    <script>
        const MASTER_ADMIN_KEY = "MARTINB-K-BOSS";

        function startFire() {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const fire = document.createElement('div');
                    fire.className = 'fire-particle';
                    fire.innerHTML = '🔥';
                    fire.style.left = Math.random() * 100 + 'vw';
                    document.body.appendChild(fire);
                    setTimeout(() => fire.remove(), 2000);
                }, i * 100);
            }
        }

        function playAtasa() {
            // This uses a text-to-speech engine to shout it if you don't have an mp3 file
            const msg = new SpeechSynthesisUtterance("Atasaaaaaaaaa");
            msg.rate = 1.2;
            msg.pitch = 2;
            window.speechSynthesis.speak(msg);
        }

        function checkUserAccess() {
            const storedPass = localStorage.getItem('dailyPass') || "0000";
            if(document.getElementById('userPass').value === storedPass) {
                playAtasa();
                startFire();
                setTimeout(() => {
                    document.getElementById('user-lock').style.display = 'none';
                    document.getElementById('predictions-view').style.display = 'block';
                    displayMatches();
                }, 500);
            } else { alert("Wrong code, bro!"); }
        }

        function openAdminPrompt() {
            if(prompt("Admin Key:") === MASTER_ADMIN_KEY) {
                document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
                document.getElementById('admin-dash').style.display = 'block';
            }
        }

        function saveData() {
            localStorage.setItem('dailyPass', document.getElementById('newDailyPass').value);
            localStorage.setItem('matchesRaw', document.getElementById('matchesInput').value);
            alert("UPLOADED!");
            location.reload();
        }

        function displayMatches() {
            const raw = localStorage.getItem('matchesRaw') || "";
            const lines = raw.split('\n');
            document.getElementById('matchesContainer').innerHTML = lines.map(line => {
                const p = line.split('|');
                if(p.length < 3) return "";
                return `<div class="match-card"><b>${p[0]}</b><br><span class="pick-val">PICK: ${p[1]}</span> | ${p[2]}</div>`;
            }).join('');
        }
    </script>
</body>
</html>
