<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARTIN'S SITE | VIP ACCESS</title>
    <style>
        :root { --bg: #050505; --door: #1a1a1a; --accent: #ffc107; --text: #ffffff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Arial Black', sans-serif; background: #000; overflow: hidden; }

        /* FOOTBALL VIDEO BACKGROUND */
        #video-bg {
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%;
            z-index: -2; filter: brightness(0.3) blur(1px); object-fit: cover;
        }
        .overlay-dark { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: -1; }

        .flex-center { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
        
        /* DOOR SCREEN */
        #door-container { text-align: center; width: 320px; z-index: 10; transition: 0.5s; }
        .door { width: 160px; height: 250px; background: var(--door); border: 5px solid #333; border-radius: 10px 10px 0 0; margin: 0 auto; position: relative; box-shadow: 0 0 50px #000; }
        .door-sign { background: #000; padding: 5px 15px; border: 1px solid var(--accent); margin-top: 40px; display: inline-block; font-size: 0.6rem; color: var(--accent); letter-spacing: 2px; }
        .handle { position: absolute; right: 15px; top: 125px; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px gold; }
        
        /* SPLASH SCREEN & PAYMENT */
        #splash-overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: rgba(0,0,0,0.92); display: none; z-index: 999; 
            flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        .mess { position: absolute; width: 100%; height: 100%; background: url('https://png.pngtree.com/png-vector/20240322/ourmid/pngtree-liquid-chocolate-splashes-brown-png-image_12187747.png'); background-size: cover; filter: brightness(0.2) contrast(1.5) sepia(100%); z-index: -1; }
        .pay-box { border: 3px solid #ff4444; padding: 25px; border-radius: 15px; background: black; width: 85%; box-shadow: 0 0 40px #ff4444; }

        /* MAIN SITE */
        #main-site { display: none; width: 100%; max-width: 450px; height: 100vh; overflow-y: auto; padding: 20px; box-sizing: border-box; background: #0b0e14; z-index: 5; margin: auto; }
        .match-card { background: #161a23; padding: 18px; margin-bottom: 12px; border-radius: 12px; border-left: 6px solid var(--accent); color: #fff; font-family: 'Inter', sans-serif; font-size: 0.95rem; }
        
        input { background: rgba(0,0,0,0.8); border: 2px solid #444; color: var(--accent); padding: 15px; width: 90%; border-radius: 10px; text-align: center; font-size: 1.2rem; margin-top: 20px; outline: none; }
        .btn-open { background: var(--accent); border: none; padding: 16px; margin-top: 15px; font-weight: 900; border-radius: 10px; cursor: pointer; width: 95%; text-transform: uppercase; color: #000; }
    </style>
</head>
<body>

    <video autoplay muted loop id="video-bg" playsinline>
        <source src="https://assets.mixkit.co/videos/preview/mixkit-football-player-kicking-the-ball-in-slow-motion-41864-large.mp4" type="video/mp4">
    </video>
    <div class="overlay-dark"></div>

    <div id="splash-overlay">
        <div class="mess"></div>
        <div class="pay-box">
